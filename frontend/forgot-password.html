<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - FINANZEN</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">
    <div class="form-container">
        <h2 class="form-title">Reset Your Password</h2>

        <!-- STEP 1: Verify identity -->
        <form id="verify-form">
            <div id="verify-alert" class="api-message error hidden"></div>
            <p style="font-size: 0.85rem; color: #555; margin-bottom: 15px;">
                Enter your username to continue.
            </p>

            <div class="form-group">
                <label for="verify-username">Username</label>
                <input type="text" id="verify-username" class="form-control" placeholder="Enter your username" required>
            </div>

            <button type="submit" class="submit-btn">Continue</button>
            <div class="form-link">
                <p>Remembered your password? <a href="login.html">Login here</a></p>
            </div>
        </form>

        <!-- STEP 2: Set new password (hidden until verified) -->
        <form id="reset-form" class="hidden">
            <div id="reset-alert" class="api-message error hidden"></div>

            <div class="form-group" style="margin-bottom: 5px;">
                <label for="new-password">New Password</label>
                <input type="password" id="new-password" class="form-control" placeholder="Create a new password" required
                    pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$"
                    title="Password must be at least 8 characters long, including an uppercase letter, a lowercase letter, a number, and a special character (@$!%*?&).">
            </div>

            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 20px;">
                <input type="checkbox" id="show-new-password" style="width: auto; cursor: pointer; margin: 0;">
                <label for="show-new-password"
                    style="font-weight: normal; font-size: 0.85rem; cursor: pointer; color: #555; margin: 0;">
                    Show password
                </label>
            </div>

            <div class="form-group" style="margin-bottom: 5px;">
                <label for="confirm-new-password">Confirm New Password</label>
                <input type="password" id="confirm-new-password" class="form-control" placeholder="Confirm your new password" required>
            </div>

            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 25px;">
                <input type="checkbox" id="show-confirm-new-password" style="width: auto; cursor: pointer; margin: 0;">
                <label for="show-confirm-new-password"
                    style="font-weight: normal; font-size: 0.85rem; cursor: pointer; color: #555; margin: 0;">
                    Show confirm password
                </label>
            </div>

            <button type="submit" class="submit-btn">Reset Password</button>
            <div class="form-link">
                <p><a href="login.html">Back to login</a></p>
            </div>
        </form>
    </div>

    <script>
        const API_URL = 'https://finanzen-backend-5pqy.onrender.com/api';

        document.addEventListener('DOMContentLoaded', function () {
            if (localStorage.getItem('finanzenToken') && localStorage.getItem('finanzenCurrentUser')) {
                window.location.href = 'dashboard.html';
            }
        });

        let resetToken = null;

        // --- STEP 1: verify identity ---
        const verifyForm = document.getElementById('verify-form');
        const resetForm = document.getElementById('reset-form');
        const verifyAlert = document.getElementById('verify-alert');

        verifyForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const submitBtn = verifyForm.querySelector('.submit-btn');
            const username = document.getElementById('verify-username').value.trim();

            submitBtn.disabled = true;
            submitBtn.textContent = 'Verifying...';
            verifyAlert.classList.add('hidden');

            try {
                const response = await fetch(`${API_URL}/forgot-password/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });

                const data = await response.json();

                if (response.ok) {
                    resetToken = data.reset_token;
                    verifyForm.classList.add('hidden');
                    resetForm.classList.remove('hidden');
                } else {
                    verifyAlert.textContent = data.detail || 'Could not verify your details. Please try again.';
                    verifyAlert.className = 'api-message error';
                    verifyAlert.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Continue';
                }
            } catch (error) {
                verifyAlert.textContent = 'Unable to connect to the server. Please try again later.';
                verifyAlert.className = 'api-message error';
                verifyAlert.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Continue';
            }
        });

        // --- Show/hide password toggles ---
        document.getElementById('show-new-password').addEventListener('change', function () {
            document.getElementById('new-password').setAttribute('type', this.checked ? 'text' : 'password');
        });
        document.getElementById('show-confirm-new-password').addEventListener('change', function () {
            document.getElementById('confirm-new-password').setAttribute('type', this.checked ? 'text' : 'password');
        });

        // --- STEP 2: submit new password ---
        const resetAlert = document.getElementById('reset-alert');

        resetForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const submitBtn = resetForm.querySelector('.submit-btn');
            const newPassword = document.getElementById('new-password').value;
            const confirmNewPassword = document.getElementById('confirm-new-password').value;

            if (newPassword !== confirmNewPassword) {
                resetAlert.textContent = 'Passwords do not match!';
                resetAlert.className = 'api-message error';
                resetAlert.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';
            resetAlert.classList.add('hidden');

            try {
                const response = await fetch(`${API_URL}/forgot-password/reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        reset_token: resetToken,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    resetAlert.textContent = 'Password reset successfully! Redirecting to login...';
                    resetAlert.className = 'api-message success';
                    resetAlert.classList.remove('hidden');

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    let errorMessage = 'Could not reset your password.';

                    if (data.detail) {
                        if (Array.isArray(data.detail)) {
                            errorMessage = data.detail.map(err => `${err.loc[1] || 'Field'}: ${err.msg}`).join(' | ');
                        } else {
                            errorMessage = data.detail;
                        }
                    }

                    resetAlert.textContent = errorMessage;
                    resetAlert.className = 'api-message error';
                    resetAlert.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset Password';
                }
            } catch (error) {
                resetAlert.textContent = 'Unable to connect to the server. Please try again later.';
                resetAlert.className = 'api-message error';
                resetAlert.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>

</html>
